<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Formulário Dra. Celina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Tokens do DS SocialCof (socialcof-tokens.css), copiados para a página ficar autônoma. */
:root {
  --sc-brand: #e2263c;
  --sc-brand-hover: #c91f33;
  --sc-brand-soft: rgba(226,38,60,.08);
  --sc-ink: #1c1d20;
  --sc-ink-muted: #6b6b6b;
  --sc-surface: #f4f4f5;
  --sc-card: #ffffff;
  --sc-border: rgba(28,29,32,.08);
  --sc-border-strong: rgba(28,29,32,.16);
  --sc-muted: oklch(96.1% 0 0);
  --sc-hover: oklch(97.31% 0 0);
  --sc-shadow-card: 0 2px 12px rgba(28,29,32,.06);
  --sc-shadow-dialog: 2px 2px 8px -1px rgba(0,0,0,.08) inset, 0 0 12px -1px rgba(0,0,0,.04) inset, 0 4px 8px -2px rgba(0,0,0,.08), 0 16px 40px rgba(0,0,0,.06);
  --sc-shadow-button: 1.1px 1.8px .6px -1.2px rgba(255,255,255,.8) inset, 5px 4px 6px -2px rgba(0,0,0,.07) inset, -1.5px -2.6px .5px -2px rgba(255,255,255,.7) inset, 0 4px 8px -2px rgba(0,0,0,.2), 0 10px 40px rgba(0,0,0,.06);
  --sc-button-from: #292929;
  --sc-button-to: #3c3c3c;
  --sc-button-hover-from: #434343;
  --sc-button-hover-to: #555555;
  --sc-on-button: #ffffff;
  --sc-success: oklch(36.38% .0737 164.7);
  --sc-success-soft: oklch(93.07% .0384 173.93);
  --sc-font-ui: 'Inter', system-ui, -apple-system, sans-serif;
  --sc-radius-card: 20px;
  --sc-radius-dialog: 32px;
  --sc-radius-field: 16px;
  --sc-radius-pill: 9999px;
  --sc-motion: 150ms cubic-bezier(.4,0,.2,1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sc-ink: #ededf0; --sc-ink-muted: #9a9aa4; --sc-surface: #111113; --sc-card: #1c1d20;
    --sc-border: rgba(237,237,240,.08); --sc-border-strong: rgba(237,237,240,.18);
    --sc-muted: #26272b; --sc-hover: #26272b; --sc-brand-soft: rgba(226,38,60,.16);
    --sc-success: oklch(86.43% .0751 172.32); --sc-success-soft: oklch(23.64% .0448 167.33);
    --sc-shadow-card: 0 2px 12px rgba(0,0,0,.4); --sc-shadow-dialog: 0 16px 40px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sc-ink: #ededf0; --sc-ink-muted: #9a9aa4; --sc-surface: #111113; --sc-card: #1c1d20;
  --sc-border: rgba(237,237,240,.08); --sc-border-strong: rgba(237,237,240,.18);
  --sc-muted: #26272b; --sc-hover: #26272b; --sc-brand-soft: rgba(226,38,60,.16);
  --sc-success: oklch(86.43% .0751 172.32); --sc-success-soft: oklch(23.64% .0448 167.33);
  --sc-shadow-card: 0 2px 12px rgba(0,0,0,.4); --sc-shadow-dialog: 0 16px 40px rgba(0,0,0,.45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100svh;
  background: var(--sc-surface);
  color: var(--sc-ink);
  font-family: var(--sc-font-ui);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  padding: max(24px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
}
.shell { width: min(100%, 680px); margin: 0 auto; }

.top { display: flex; justify-content: flex-end; min-height: 20px; margin-bottom: 8px; }
.saved { font-size: 12px; color: var(--sc-ink-muted); opacity: 0; transition: opacity var(--sc-motion); }
.saved.on { opacity: 1; }

.progress { margin-bottom: 16px; }
.progress-meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--sc-ink-muted); margin-bottom: 8px; font-variant-numeric: tabular-nums; }
.progress-bar { height: 6px; background: var(--sc-muted); border-radius: var(--sc-radius-pill); overflow: hidden; }
.progress-fill { height: 100%; width: 0; background: var(--sc-brand); border-radius: inherit; transition: width 300ms cubic-bezier(.4,0,.2,1); }

.card {
  background: var(--sc-card);
  border: 1px solid var(--sc-border);
  border-radius: var(--sc-radius-dialog);
  box-shadow: var(--sc-shadow-dialog);
  padding: 40px;
}
.eyebrow { font-size: 13px; font-weight: 500; color: var(--sc-brand); margin: 0 0 8px; }
h1, h2 { margin: 0 0 12px; font-weight: 700; letter-spacing: -.025em; line-height: 1.2; text-wrap: balance; }
h1 { font-size: 30px; }
h2 { font-size: 24px; }
.lead { color: var(--sc-ink-muted); margin: 0 0 28px; text-wrap: pretty; }

.facts { display: grid; gap: 10px; margin: 0 0 32px; padding: 0; list-style: none; }
.facts li { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; background: var(--sc-muted); border-radius: var(--sc-radius-card); font-size: 14px; }
.facts svg { flex: none; margin-top: 2px; color: var(--sc-brand); }

.q { padding: 24px 0; border-top: 1px solid var(--sc-border); }
.q:first-of-type { border-top: 0; padding-top: 4px; }
.q-label { display: flex; gap: 10px; font-weight: 600; margin-bottom: 4px; }
.q-num { flex: none; color: var(--sc-ink-muted); font-weight: 500; font-variant-numeric: tabular-nums; min-width: 22px; }
.q-hint { color: var(--sc-ink-muted); font-size: 13px; margin: 0 0 12px 32px; }
.q-body { margin-left: 32px; }

textarea, input[type="text"] {
  width: 100%;
  font: inherit;
  font-size: 16px;
  color: var(--sc-ink);
  background: var(--sc-card);
  border: 1px solid var(--sc-border-strong);
  border-radius: var(--sc-radius-field);
  padding: 12px 16px;
  transition: border-color var(--sc-motion), box-shadow var(--sc-motion);
}
input[type="text"] { min-height: 48px; border-radius: var(--sc-radius-pill); padding: 0 20px; }
textarea { min-height: 104px; resize: vertical; }
textarea:focus, input[type="text"]:focus { outline: none; border-color: var(--sc-ink-muted); box-shadow: 0 0 0 3px var(--sc-border); }
::placeholder { color: var(--sc-ink-muted); opacity: .7; }
.extra { margin-top: 10px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.chip span {
  display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 16px;
  border: 1px solid var(--sc-border-strong); border-radius: var(--sc-radius-pill);
  background: var(--sc-card); font-size: 14px; font-weight: 500; cursor: pointer; user-select: none;
  transition: background var(--sc-motion), border-color var(--sc-motion), color var(--sc-motion), transform var(--sc-motion);
}
.chip:hover span { background: var(--sc-hover); }
.chip input:checked + span { background: var(--sc-ink); border-color: var(--sc-ink); color: var(--sc-card); }
.chip input:focus-visible + span { outline: 2px solid var(--sc-ink-muted); outline-offset: 2px; }
.chip input:disabled + span { opacity: .4; cursor: not-allowed; }
.chip:active span { transform: scale(.97); }
.q-error { display: flex; align-items: center; gap: 6px; margin: 10px 0 0 32px; font-size: 13px; font-weight: 500; color: var(--sc-brand); }
.q-error[hidden] { display: none; }
.q.invalid textarea, .q.invalid input[type="text"]:not(.extra), .q.invalid .chip span { border-color: var(--sc-brand); }
.limit-note { font-size: 12px; color: var(--sc-ink-muted); margin-top: 8px; font-variant-numeric: tabular-nums; }

.actions { display: flex; gap: 12px; justify-content: space-between; align-items: center; margin-top: 32px; flex-wrap: wrap; }
.actions .spacer { flex: 1; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 24px; border-radius: var(--sc-radius-pill);
  font: inherit; font-weight: 500; font-size: 15px; cursor: pointer; text-decoration: none;
  border: 1px solid transparent; transition: background var(--sc-motion), transform var(--sc-motion), border-color var(--sc-motion);
}
.btn:active { transform: scale(.98); }
.btn:focus-visible { outline: 2px solid var(--sc-ink-muted); outline-offset: 3px; }
.btn-primary { background: linear-gradient(135deg, var(--sc-button-from), var(--sc-button-to)); color: var(--sc-on-button); box-shadow: var(--sc-shadow-button); }
.btn-primary:hover { background: linear-gradient(135deg, var(--sc-button-hover-from), var(--sc-button-hover-to)); }
.btn-brand { background: var(--sc-brand); color: #fff; }
.btn-brand:hover { background: var(--sc-brand-hover); }
.btn-ghost { background: transparent; color: var(--sc-ink); border-color: var(--sc-border-strong); }
.btn-ghost:hover { background: var(--sc-hover); }
.btn-link { background: none; border: 0; color: var(--sc-ink-muted); padding: 0 8px; min-height: 44px; }
.btn-link:hover { color: var(--sc-ink); }
.btn[disabled] { opacity: .5; pointer-events: none; }

.review-section { margin-top: 24px; }
.review-section h3 { font-size: 14px; font-weight: 600; color: var(--sc-ink-muted); margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; }
.review-section h3 button { font: inherit; font-size: 13px; color: var(--sc-ink); background: none; border: 0; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; min-height: 44px; }
.review-list { margin: 0; padding: 16px 20px; background: var(--sc-muted); border-radius: var(--sc-radius-card); }
.review-list dt { font-size: 13px; color: var(--sc-ink-muted); }
.review-list dd { margin: 2px 0 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.review-list dd:last-child { margin-bottom: 0; }
.review-list dd.empty { color: var(--sc-ink-muted); font-style: italic; }

.send-grid { display: grid; gap: 10px; margin-top: 8px; }
.notice { padding: 14px 16px; border-radius: var(--sc-radius-card); font-size: 14px; margin-top: 16px; }
.notice.ok { background: var(--sc-success-soft); color: var(--sc-success); }
.notice.err { background: var(--sc-brand-soft); color: var(--sc-brand); }

.done-icon { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--sc-success-soft); color: var(--sc-success); margin-bottom: 20px; }


.screen { animation: enter 220ms cubic-bezier(.4,0,.2,1); }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .screen { animation: none; } .progress-fill { transition: none; } }

@media (max-width: 600px) {
  .card { padding: 28px 20px; border-radius: 24px; }
  h1 { font-size: 26px; }
  h2 { font-size: 22px; }
  .q-hint, .q-body, .q-error { margin-left: 0; }
  .actions { flex-direction: column-reverse; align-items: stretch; }
  .actions .spacer { display: none; }
  .btn { width: 100%; }
}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <span class="saved" id="saved" aria-live="polite">Rascunho salvo</span>
  </header>

  <div class="progress" id="progress" hidden>
    <div class="progress-meta"><span id="progress-label"></span><span id="progress-count"></span></div>
    <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  </div>

  <main class="card" id="app"></main>
</div>

<script>
/* Para onde as respostas vão. Preencha antes de subir no domínio.
   endpoint: URL que aceita POST em JSON (Formspree, Getform, uma função própria). Vazio = sem envio automático.
   email / whatsapp: usados como alternativa quando não há endpoint. WhatsApp só com números, com DDI (ex.: 5511999999999). */
const CONFIG = {
  endpoint: '/api/forms',
  email: '',
  whatsapp: '',
};

const STORAGE_KEY = 'questionario-dra-celina-v2';

const AREAS = ['Pele no dia a dia (acne, manchas, alergias)', 'Estética e rejuvenescimento', 'Cabelo e couro cabeludo', 'Unhas', 'Pequenas cirurgias de pele', 'Prevenção e check-up de pintas'];

const SECTIONS = [
  { title: 'Sobre você', intro: 'Para apresentar você do jeito certo no site.', questions: [
    { id: 'q1', type: 'multi', label: 'O que você quer que apareça na sua apresentação?', hint: 'Marque só o que fizer sentido para você.', options: ['Nome completo', 'Número do CRM', 'Títulos e especializações', 'Pós-graduações e cursos', 'Onde estudou', 'Tempo de experiência'], extra: 'Como prefere ser chamada?' },
    { id: 'q2', type: 'textarea', label: 'Em poucas linhas, conte sua trajetória.', hint: 'Formação, onde atuou e o que mais marcou seu caminho.' },
    { id: 'q3', type: 'multi', label: 'O que mais te motiva no seu trabalho?', options: ['Ver a autoestima do paciente melhorar', 'Resolver casos difíceis', 'Cuidar da saúde da pele a longo prazo', 'Resultados que o paciente vê', 'Acompanhar o paciente por anos'], extra: 'Outro motivo' },
    { id: 'q4', type: 'multi', label: 'O que os pacientes mais elogiam no seu atendimento?', options: ['Atenção e escuta', 'Explicações claras', 'Resultados naturais', 'Pontualidade', 'Ambiente do consultório', 'Acompanhamento depois da consulta'], extra: 'Outro elogio' },
  ]},
  { title: 'Seu trabalho', intro: 'O que você faz e onde atende.', questions: [
    { id: 'q5', type: 'multi', label: 'Quais áreas você atende?', options: AREAS, extra: 'Procedimentos que você faz' },
    { id: 'q6', type: 'multi', max: 3, label: 'Quais você mais quer divulgar?', options: AREAS },
    { id: 'q7', type: 'single', label: 'Como você atende?', options: ['Só presencial', 'Presencial e online', 'Só online'], extra: 'Cidade e bairro' },
    { id: 'q8', type: 'single', label: 'Você atende por convênio, particular ou os dois?', options: ['Convênio', 'Particular', 'Os dois'], extra: 'Quais convênios? (opcional)' },
  ]},
  { title: 'Seus pacientes', intro: 'Para o site falar com as pessoas certas.', questions: [
    { id: 'q9', type: 'multi', label: 'Quem você mais gosta de atender?', options: ['Crianças', 'Adolescentes', 'Adultos de 18 a 30', 'Adultos de 30 a 50', 'Acima de 50'] },
    { id: 'q10', type: 'multi', label: 'Quais dúvidas os pacientes mais trazem antes de marcar?', options: ['Valor da consulta', 'Se atende convênio', 'Em quanto tempo vê resultado', 'Se o procedimento dói', 'Quantas sessões são necessárias', 'Cuidados depois do procedimento'], extra: 'Outra dúvida' },
    { id: 'q11', type: 'multi', label: 'Como as pessoas chegam até você hoje?', options: ['Indicação', 'Instagram', 'Google', 'Convênio', 'Plataformas de agendamento'], extra: 'Outro caminho' },
  ]},
  { title: 'Sua marca', intro: 'Aqui começa a identidade visual.', questions: [
    { id: 'q12', type: 'single', label: 'Você já tem logo, cores ou algum material visual?', hint: 'Se tiver os arquivos, cole um link ou mande depois pelo WhatsApp.', options: ['Tenho e quero manter', 'Tenho, mas quero mudar', 'Ainda não tenho'], extra: 'Link dos arquivos (opcional)' },
    { id: 'q13', type: 'multi', max: 3, label: 'Escolha até três palavras para como você quer que o paciente se sinta ao conhecer sua marca.', options: ['Acolhido', 'Seguro', 'Leve', 'Cuidado', 'Confiante', 'Bem informado', 'À vontade', 'Especial'] },
    { id: 'q14', type: 'multi', max: 3, label: 'E até três que você não quer de jeito nenhum.', options: ['Frio', 'Artificial', 'Exagerado', 'Distante', 'Comercial demais', 'Infantil', 'Sério demais'] },
    { id: 'q15', type: 'multi', max: 3, label: 'Quais tons combinam com você?', hint: 'Escolha até três.', options: ['Neutros e areia', 'Terrosos', 'Verdes', 'Rosados e nude', 'Azuis', 'Preto e branco', 'Dourado'], extra: 'Alguma cor que você não quer?' },
    { id: 'q16', type: 'single', label: 'Qual estilo te atrai mais?', options: ['Minimalista e clean', 'Elegante e sofisticado', 'Natural e orgânico', 'Moderno e marcante', 'Delicado'], extra: 'Links de referência (opcional)' },
    { id: 'q17', type: 'single', label: 'Como você imagina sua logo?', options: ['Só o nome escrito', 'Nome com um símbolo', 'Iniciais (monograma)', 'Não sei, quero sugestões'], extra: 'Símbolo especial (opcional)' },
  ]},
  { title: 'Seu jeito de falar', intro: 'Para os textos soarem como você.', questions: [
    { id: 'q18', type: 'multi', label: 'Como é sua conversa no consultório?', options: ['Leve', 'Acolhedora', 'Didática', 'Direta', 'Técnica', 'Bem-humorada'] },
    { id: 'q19', type: 'single', label: 'Como prefere que o site fale com o paciente?', options: ['Próximo, tratando por você', 'Mais formal', 'Tanto faz'], extra: 'Palavras que são a sua cara' },
  ]},
  { title: 'O site', intro: 'O que ele precisa fazer por você.', questions: [
    { id: 'q20', type: 'multi', label: 'O que você mais quer que a pessoa faça ao entrar no site?', options: ['Marcar consulta', 'Falar no WhatsApp', 'Conhecer você melhor', 'Ver os tratamentos', 'Seguir no Instagram'] },
    { id: 'q21', type: 'multi', label: 'O que você já tem?', options: ['Domínio (endereço do site)', 'E-mail profissional', 'Perfil no Google', 'Instagram profissional', 'Nada disso ainda'], extra: 'Endereços (opcional)' },
    { id: 'q22', type: 'single', label: 'Você tem fotos profissionais suas ou do consultório?', options: ['Tenho fotos recentes', 'Tenho, mas são antigas', 'Ainda não tenho'] },
    { id: 'q23', type: 'single', label: 'Toparia fazer um ensaio de fotos novo?', options: ['Sim', 'Talvez', 'Prefiro não'] },
    { id: 'q24', type: 'single', label: 'Tem depoimentos de pacientes que autorizaram o uso?', options: ['Sim, tenho', 'Posso pedir', 'Prefiro não usar'] },
  ]},
  { title: 'Atendimento e prontuário', intro: 'Para facilitar sua rotina, não só o site.', questions: [
    { id: 'q25', type: 'multi', label: 'Como o paciente marca consulta hoje?', options: ['WhatsApp', 'Telefone', 'Instagram', 'Plataforma de agendamento'] },
    { id: 'q26', type: 'single', label: 'Quem responde as mensagens?', options: ['Eu mesma', 'Secretária', 'As duas'] },
    { id: 'q27', type: 'single', label: 'Você usa algum sistema para agenda ou prontuário?', options: ['iClinic', 'Feegow', 'Doctoralia', 'Outro sistema', 'Papel', 'Nenhum'], extra: 'Se for outro, qual?' },
    { id: 'q28', type: 'multi', label: 'O que facilitaria sua rotina?', hint: 'Marque quantas quiser.', options: ['Ficha que o paciente preenche antes da consulta', 'Agendamento online', 'Lembretes automáticos de consulta', 'Envio de orientações e receitas pelo sistema', 'Termos de consentimento assinados online'] },
  ]},
  { title: 'Para fechar', intro: 'Últimas duas.', questions: [
    { id: 'q29', type: 'single', label: 'Para quando você gostaria do site no ar?', options: ['Em até 1 mês', 'Em 2 a 3 meses', 'Sem pressa'], extra: 'Data especial (opcional)' },
    { id: 'q30', type: 'textarea', optional: true, label: 'Quer contar mais alguma coisa? (opcional)' },
  ]},
];

const TOTAL_Q = SECTIONS.reduce((n, s) => n + s.questions.length, 0);
const app = document.getElementById('app');
let state = load();

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return Object.assign({ step: -1, answers: {}, sent: false }, JSON.parse(raw));
  } catch (_) {}
  return { step: -1, answers: {}, sent: false };
}
function newId() { return crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2); }
if (!state.id) state.id = newId();

let savedTimer;
function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const el = document.getElementById('saved');
    el.classList.add('on');
    clearTimeout(savedTimer);
    savedTimer = setTimeout(() => el.classList.remove('on'), 1400);
  } catch (_) {}
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function numberOf(id) { return Number(id.replace('q', '')); }

function answerText(q) {
  const a = state.answers[q.id];
  if (!a) return '';
  if (q.type === 'text' || q.type === 'textarea') return (a.value || '').trim();
  const picked = q.type === 'single' ? (a.value ? [a.value] : []) : (a.values || []);
  const parts = picked.length ? [picked.join(', ')] : [];
  if (a.extra && a.extra.trim()) parts.push(a.extra.trim());
  return parts.join('\n');
}

function answeredCount() {
  return SECTIONS.flatMap(s => s.questions).filter(q => answerText(q)).length;
}

function setProgress() {
  const box = document.getElementById('progress');
  const inForm = state.step >= 0 && state.step <= SECTIONS.length && !state.sent;
  box.hidden = !inForm;
  if (!inForm) return;
  const done = answeredCount();
  const pct = Math.round((done / TOTAL_Q) * 100);
  document.getElementById('progress-label').textContent = state.step < SECTIONS.length ? `Parte ${state.step + 1} de ${SECTIONS.length}` : 'Revisão';
  document.getElementById('progress-count').textContent = `${done} de ${TOTAL_Q} respondidas`;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-bar').setAttribute('aria-valuenow', pct);
}

function go(step) {
  state.step = step;
  save();
  render();
  window.scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  const h = app.querySelector('h1, h2');
  if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
}

function render() {
  setProgress();
  if (state.sent) return renderDone();
  if (state.step < 0) return renderIntro();
  if (state.step >= SECTIONS.length) return renderReview();
  renderSection(state.step);
}

const check = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';

function renderIntro() {
  const resumed = answeredCount() > 0;
  app.innerHTML = `<section class="screen">
    <p class="eyebrow">Marca e site</p>
    <h1>Olá, Dra. Celina</h1>
    <p class="lead">Estas perguntas ajudam a construir sua identidade visual, seu site e a organizar o atendimento online. Responda do seu jeito, sem se preocupar com o texto.</p>
    <ul class="facts">
      <li>${check}<span>São ${TOTAL_Q} perguntas em ${SECTIONS.length} partes curtas. Quase tudo é só marcar. Leva uns 10 minutos.</span></li>
      <li>${check}<span>Todas as perguntas precisam de resposta, menos a última.</span></li>
      <li>${check}<span>O rascunho fica salvo neste aparelho. Dá para parar e voltar quando quiser.</span></li>
    </ul>
    <div class="actions">
      ${resumed ? '<button class="btn btn-link" id="restart" type="button">Começar do zero</button>' : '<span class="spacer"></span>'}
      <button class="btn btn-primary" id="start" type="button">${resumed ? 'Continuar de onde parei' : 'Começar'}</button>
    </div>
  </section>`;
  document.getElementById('start').onclick = () => go(resumed ? firstIncompleteStep() : 0);
  const r = document.getElementById('restart');
  if (r) r.onclick = () => { state = { step: -1, answers: {}, sent: false, id: newId() }; save(); render(); };
}

function firstIncompleteStep() {
  const i = SECTIONS.findIndex(s => missingIn(s).length > 0);
  return i === -1 ? SECTIONS.length : i;
}

function fieldHTML(q) {
  const a = state.answers[q.id] || {};
  const n = numberOf(q.id);
  const labelId = `${q.id}-label`;
  let body = '';
  if (q.type === 'textarea') {
    body = `<textarea id="${q.id}" data-q="${q.id}" aria-labelledby="${labelId}" placeholder="Escreva aqui">${esc(a.value || '')}</textarea>`;
  } else if (q.type === 'text') {
    body = `<input type="text" id="${q.id}" data-q="${q.id}" aria-labelledby="${labelId}" placeholder="${esc(q.placeholder || 'Escreva aqui')}" value="${esc(a.value || '')}">`;
  } else {
    const isSingle = q.type === 'single';
    const picked = isSingle ? [a.value] : (a.values || []);
    const full = q.max && picked.length >= q.max;
    body = `<div class="chips" role="group" aria-labelledby="${labelId}">` + q.options.map((opt, i) => {
      const on = picked.includes(opt);
      return `<label class="chip"><input type="${isSingle ? 'radio' : 'checkbox'}" name="${q.id}" data-opt="${q.id}" value="${esc(opt)}" ${on ? 'checked' : ''} ${!on && full ? 'disabled' : ''}><span>${esc(opt)}</span></label>`;
    }).join('') + '</div>';
    if (q.max) body += `<p class="limit-note" id="${q.id}-limit">${picked.length} de ${q.max} escolhidas</p>`;
    if (q.extra) body += `<input type="text" class="extra" data-extra="${q.id}" aria-label="${esc(q.extra)}" placeholder="${esc(q.extra)}" value="${esc(a.extra || '')}">`;
  }
  return `<div class="q" data-wrap="${q.id}">
    <div class="q-label" id="${labelId}"><span class="q-num">${n}.</span><span>${esc(q.label)}</span></div>
    ${q.hint ? `<p class="q-hint">${esc(q.hint)}</p>` : '<div style="height:8px"></div>'}
    <div class="q-body">${body}</div>
    <p class="q-error" id="${q.id}-err" role="alert" hidden>Responda esta pergunta para continuar.</p>
  </div>`;
}

function renderSection(i) {
  const s = SECTIONS[i];
  const last = i === SECTIONS.length - 1;
  app.innerHTML = `<section class="screen">
    <p class="eyebrow">Parte ${i + 1} de ${SECTIONS.length}</p>
    <h2>${esc(s.title)}</h2>
    <p class="lead">${esc(s.intro)}</p>
    <form id="form" novalidate>${s.questions.map(fieldHTML).join('')}</form>
    <div class="actions">
      <button class="btn btn-ghost" id="back" type="button">Voltar</button>
      <span class="spacer"></span>
      <button class="btn btn-primary" id="next" type="button">${last ? 'Revisar respostas' : 'Próxima parte'}</button>
    </div>
  </section>`;
  bindInputs(s);
  document.getElementById('back').onclick = () => go(i - 1);
  document.getElementById('next').onclick = () => {
    const miss = missingIn(s);
    if (miss.length) return flagMissing(miss);
    go(i + 1);
  };
}

function bindInputs(s) {
  const form = document.getElementById('form');
  form.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.q) {
      state.answers[t.dataset.q] = Object.assign(state.answers[t.dataset.q] || {}, { value: t.value });
    } else if (t.dataset.extra) {
      state.answers[t.dataset.extra] = Object.assign(state.answers[t.dataset.extra] || {}, { extra: t.value });
    } else return;
    clearMissing(t.dataset.q || t.dataset.extra);
    save(); setProgress();
  });
  form.addEventListener('change', e => {
    const t = e.target;
    const id = t.dataset.opt;
    if (!id) return;
    const q = s.questions.find(x => x.id === id);
    const a = state.answers[id] = state.answers[id] || {};
    if (q.type === 'single') {
      a.value = t.value;
    } else {
      const boxes = [...form.querySelectorAll(`input[data-opt="${id}"]`)];
      a.values = boxes.filter(b => b.checked).map(b => b.value);
      if (q.max) {
        const full = a.values.length >= q.max;
        boxes.forEach(b => { b.disabled = !b.checked && full; });
        document.getElementById(`${id}-limit`).textContent = `${a.values.length} de ${q.max} escolhidas`;
      }
    }
    clearMissing(id);
    save(); setProgress();
  });
  // Pergunta de escolha única: clicar de novo na opção marcada desmarca.
  form.querySelectorAll('input[type="radio"]').forEach(r => {
    r.addEventListener('click', () => {
      const a = state.answers[r.name];
      if (r.dataset.wasChecked === '1') {
        r.checked = false; r.dataset.wasChecked = '0';
        if (a) a.value = '';
        save(); setProgress();
      } else {
        form.querySelectorAll(`input[name="${r.name}"]`).forEach(o => { o.dataset.wasChecked = '0'; });
        r.dataset.wasChecked = '1';
      }
    });
    if (r.checked) r.dataset.wasChecked = '1';
  });
}

function missingIn(s) {
  return s.questions.filter(q => !q.optional && !answerText(q)).map(q => q.id);
}

function flagMissing(ids) {
  ids.forEach(id => {
    document.querySelector(`[data-wrap="${id}"]`).classList.add('invalid');
    document.getElementById(`${id}-err`).hidden = false;
  });
  const first = document.querySelector(`[data-wrap="${ids[0]}"]`);
  first.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center' });
  const focusable = first.querySelector('textarea, input');
  if (focusable) focusable.focus({ preventScroll: true });
}

function clearMissing(id) {
  const wrap = document.querySelector(`[data-wrap="${id}"]`);
  if (!wrap || !wrap.classList.contains('invalid')) return;
  wrap.classList.remove('invalid');
  document.getElementById(`${id}-err`).hidden = true;
}

function asPlainText() {
  const lines = ['Questionário Dra. Celina', `Respondido em ${new Date().toLocaleString('pt-BR')}`, ''];
  SECTIONS.forEach(s => {
    lines.push(s.title.toUpperCase(), '');
    s.questions.forEach(q => {
      lines.push(`${numberOf(q.id)}. ${q.label}`, answerText(q) || '(sem resposta)', '');
    });
  });
  return lines.join('\n');
}

function asJSON() {
  return {
    formulario: 'questionario-dra-celina',
    enviado_em: new Date().toISOString(),
    respostas: SECTIONS.flatMap(s => s.questions.map(q => ({
      secao: s.title, numero: numberOf(q.id), pergunta: q.label, resposta: answerText(q),
    }))),
  };
}

function renderReview() {
  const done = answeredCount();
  const blocks = SECTIONS.map((s, i) => `<div class="review-section">
    <h3><span>${esc(s.title)}</span><button type="button" data-edit="${i}">Editar</button></h3>
    <dl class="review-list">${s.questions.map(q => {
      const t = answerText(q);
      return `<dt>${numberOf(q.id)}. ${esc(q.label)}</dt><dd class="${t ? '' : 'empty'}">${t ? esc(t) : 'Sem resposta'}</dd>`;
    }).join('')}</dl>
  </div>`).join('');

  const hasEndpoint = !!CONFIG.endpoint;
  const pendingStep = firstIncompleteStep();
  let sendButtons = '';
  if (pendingStep < SECTIONS.length) {
    sendButtons = `<p class="notice err">Ainda falta responder algumas perguntas.</p><button class="btn btn-primary" id="pending" type="button">Ir para o que falta</button>`;
  } else if (hasEndpoint) {
    sendButtons = `<button class="btn btn-brand" id="send" type="button">Enviar respostas</button>`;
  } else {
    if (CONFIG.whatsapp) sendButtons += `<button class="btn btn-brand" id="wa" type="button">Enviar pelo WhatsApp</button>`;
    if (CONFIG.email) sendButtons += `<button class="btn btn-primary" id="mail" type="button">Enviar por e-mail</button>`;
  }
  if (pendingStep >= SECTIONS.length) sendButtons += `<button class="btn btn-ghost" id="copy" type="button">Copiar respostas</button>
    <button class="btn btn-ghost" id="download" type="button">Baixar arquivo</button>`;

  app.innerHTML = `<section class="screen">
    <p class="eyebrow">Revisão</p>
    <h2>Confira antes de enviar</h2>
    <p class="lead">Você respondeu ${done} de ${TOTAL_Q}. ${done < TOTAL_Q ? '' : 'Tudo respondido.'}</p>
    ${blocks}
    <div class="review-section">
      <h3><span>Enviar</span></h3>
      <div class="send-grid">${sendButtons}</div>
      <div id="notice" aria-live="polite"></div>
    </div>
    <div class="actions">
      <button class="btn btn-ghost" id="back" type="button">Voltar</button>
    </div>
  </section>`;

  app.querySelectorAll('[data-edit]').forEach(b => { b.onclick = () => go(Number(b.dataset.edit)); });
  document.getElementById('back').onclick = () => go(SECTIONS.length - 1);
  const pending = document.getElementById('pending');
  if (pending) { pending.onclick = () => go(pendingStep); return; }
  document.getElementById('copy').onclick = copyAnswers;
  document.getElementById('download').onclick = downloadAnswers;
  const send = document.getElementById('send');
  if (send) send.onclick = () => sendToEndpoint(send);
  const wa = document.getElementById('wa');
  if (wa) wa.onclick = () => {
    window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(asPlainText())}`, '_blank', 'noopener');
    markSent();
  };
  const mail = document.getElementById('mail');
  if (mail) mail.onclick = () => {
    location.href = `mailto:${CONFIG.email}?subject=${encodeURIComponent('Questionário Dra. Celina')}&body=${encodeURIComponent(asPlainText())}`;
    markSent();
  };
}

function notice(msg, kind) {
  document.getElementById('notice').innerHTML = `<div class="notice ${kind}">${esc(msg)}</div>`;
}

async function copyAnswers() {
  try {
    await navigator.clipboard.writeText(asPlainText());
    notice('Respostas copiadas. Agora é só colar numa mensagem.', 'ok');
  } catch (_) {
    notice('Não deu para copiar neste navegador. Use o botão de baixar arquivo.', 'err');
  }
}

function downloadAnswers() {
  const blob = new Blob([asPlainText()], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'questionario-dra-celina.txt';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  notice('Arquivo baixado. Pode mandar por WhatsApp ou e-mail.', 'ok');
}

async function sendToEndpoint(btn) {
  btn.disabled = true;
  btn.textContent = 'Enviando...';
  try {
    const res = await fetch(CONFIG.endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(Object.assign(asJSON(), { id: state.id, texto: asPlainText() })),
    });
    if (!res.ok) throw new Error(String(res.status));
    markSent();
  } catch (_) {
    btn.disabled = false;
    btn.textContent = 'Tentar de novo';
    notice('Não conseguimos enviar agora. Suas respostas continuam salvas. Tente de novo ou use copiar ou baixar.', 'err');
  }
}

function markSent() {
  state.sent = true;
  save();
  render();
}

function renderDone() {
  app.innerHTML = `<section class="screen">
    <div class="done-icon">${check.replace('width="18" height="18"', 'width="26" height="26"')}</div>
    <h2>Obrigada, Dra. Celina</h2>
    <p class="lead">Recebemos suas respostas. O próximo passo é uma conversa rápida para alinhar os detalhes e mostrar as primeiras ideias de marca.</p>
    <div class="actions">
      <button class="btn btn-ghost" id="review" type="button">Ver minhas respostas</button>
      <span class="spacer"></span>
      <button class="btn btn-link" id="download" type="button">Baixar uma cópia</button>
    </div>
  </section>`;
  document.getElementById('review').onclick = () => { state.sent = false; go(SECTIONS.length); };
  document.getElementById('download').onclick = () => {
    const blob = new Blob([asPlainText()], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'questionario-dra-celina.txt';
    document.body.appendChild(a); a.click(); a.remove();
  };
}

render();
</script>
</body>
</html>
